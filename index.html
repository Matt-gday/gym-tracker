<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PCYC Gym">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PCYC Gym Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Mono:wght@400;700&display=swap');

:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1c1c1c;
  --surface3: #252525;
  --border: #2a2a2a;
  --text: #e8e8e8;
  --text2: #999;
  --text3: #666;
  --accent: #4ade80;
  --accent2: #22c55e;
  --accent-dim: rgba(74,222,128,0.1);
  --accent-dim2: rgba(74,222,128,0.2);
  --orange: #fb923c;
  --orange-dim: rgba(251,146,60,0.15);
  --red: #f87171;
  --red-dim: rgba(248,113,113,0.15);
  --blue: #60a5fa;
  --blue-dim: rgba(96,165,250,0.15);
  --yellow: #facc15;
  --radius: 16px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
*::-webkit-scrollbar { display:none; }
* { -ms-overflow-style:none; scrollbar-width:none; }

body {
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}

.app {
  max-width:600px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* TAB BAR */
.tab-bar {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:600px;
  display:flex;
  background:rgba(14,14,14,0.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:8px 4px calc(8px + var(--safe-bottom));
  z-index:100;
}
.tab-btn {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  padding:6px 2px;
  background:none;
  border:none;
  color:var(--text3);
  font-size:11px;
  font-family:'DM Sans',sans-serif;
  font-weight:500;
  cursor:pointer;
  transition:color 0.2s;
}
.tab-btn.active { color:var(--accent); }
.tab-btn svg { width:24px; height:24px; }

/* PAGES */
.page {
  display:none;
  flex:1;
  padding:calc(16px + var(--safe-top)) 16px calc(80px + var(--safe-bottom));
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.page.active { display:flex; flex-direction:column; }

/* HEADERS */
.page-title {
  font-size:32px;
  font-weight:700;
  letter-spacing:-0.5px;
  margin-bottom:4px;
}
.page-sub {
  font-size:16px;
  color:var(--text2);
  margin-bottom:20px;
  line-height:1.4;
}

/* CARDS */
.card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  cursor:pointer;
  transition:background 0.15s, transform 0.1s;
}
.card:active { transform:scale(0.98); background:var(--surface2); }
.card-title { font-size:18px; font-weight:600; margin-bottom:4px; }
.card-meta { font-size:15px; color:var(--text2); }

/* WEEK LIST ROWS */
.week-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.week-row-left {
  display:flex;
  align-items:center;
  gap:14px;
}
.week-row-num {
  font-family:'Space Mono',monospace;
  font-size:20px;
  font-weight:700;
  color:var(--text3);
  min-width:28px;
  text-align:center;
}
.week-row-title { font-size:16px; font-weight:600; }
.week-row-sub { font-size:13px; color:var(--text2); margin-top:2px; }
.week-row.current-week { border-color:var(--accent); background:var(--accent-dim); }
.week-row.current-week .week-row-num { color:var(--accent); }
.current-badge {
  display:inline-block;
  font-size:10px;
  font-weight:700;
  letter-spacing:0.5px;
  color:var(--accent);
  background:var(--accent-dim);
  border:1px solid var(--accent);
  border-radius:5px;
  padding:2px 6px;
  vertical-align:middle;
  margin-left:6px;
}
.deload-control { margin: 12px 0; }
.deload-suggestion {
  font-size:13px;
  color:var(--orange);
  background:var(--orange-dim);
  border:1px solid var(--orange);
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:8px;
  line-height:1.4;
}
.deload-toggle-btn {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--orange);
  background:var(--orange-dim);
  color:var(--orange);
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}
.deload-skipped-tag {
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:13px;
  color:var(--text2);
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
}
.deload-skipped-tag button {
  background:none;
  border:none;
  color:var(--accent);
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  padding:0;
}
.reset-week-btn {
  padding:8px 14px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text2);
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  flex-shrink:0;
}
.reset-week-btn:active { background:var(--red-dim); color:var(--red); border-color:var(--red); }

/* Cardio options */
.cardio-opt {
  padding:12px 18px;
  border-radius:var(--radius-sm);
  border:2px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:17px;
  font-weight:600;
  cursor:pointer;
  flex:1;
  min-width:calc(50% - 4px);
  text-align:center;
}
.cardio-opt:active { border-color:var(--accent); background:var(--accent-dim); color:var(--accent); }
.cardio-opt.selected { border-color:var(--accent); background:var(--accent-dim); color:var(--accent); }

/* DAY CARDS */
.day-card { position:relative; overflow:hidden; }
.day-card .day-icon {
  width:40px; height:40px;
  border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:18px;
  margin-bottom:10px;
}
.day-card .day-icon.squat { background:var(--accent-dim); color:var(--accent); }
.day-card .day-icon.bench { background:var(--blue-dim); color:var(--blue); }
.day-card .day-icon.dead { background:var(--orange-dim); color:var(--orange); }
.day-card .day-icon.upper { background:var(--red-dim); color:var(--red); }
.day-card .day-focus { font-size:15px; color:var(--text2); margin-bottom:2px; }
.day-card .day-name { font-size:20px; font-weight:700; }
.day-card .day-ex-count { font-size:15px; color:var(--text3); margin-top:4px; }
.day-card .day-progress {
  position:absolute; right:16px; top:50%; transform:translateY(-50%);
  font-family:'Space Mono',monospace;
  font-size:16px; color:var(--text3);
}
.day-card .day-progress .done { color:var(--accent); }
.day-card.completed-day { opacity:0.6; border-color:var(--accent); }
.day-card.completed-day .day-focus { color:var(--accent); }
.day-card.next-day { border-color:var(--accent); background:var(--accent-dim); }

/* EXERCISE LIST (DAY VIEW) */
.ex-list-item {
  display:flex;
  align-items:center;
  gap:8px;
  padding:16px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  margin-bottom:10px;
  cursor:pointer;
  transition:background 0.15s, transform 0.1s;
}
.ex-list-item:active { transform:scale(0.98); background:var(--surface2); }
.ex-list-item .ex-num {
  font-family:'Space Mono',monospace;
  font-size:18px;
  color:var(--text3);
  width:22px;
  flex-shrink:0;
}
.ex-list-item .ex-name {
  flex:1;
  font-size:18px;
  font-weight:500;
}
.ex-list-item .ex-sets-info {
  font-size:16px;
  color:var(--text3);
  font-weight:500;
}
.ex-list-item.completed { border-color:var(--accent); background:var(--accent-dim); }
.ex-list-item.skipped-item { opacity:0.5; }
.ex-list-item.completed .ex-num { color:var(--accent); }
.info-btn {
  width:34px; height:38px;
  border-radius:10px;
  background:var(--surface3);
  border:1px solid var(--border);
  color:var(--text2);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  font-family:'DM Sans',sans-serif;
  font-size:18px;
  font-weight:700;
}
.info-btn:active { background:var(--accent-dim); color:var(--accent); border-color:var(--accent); }
.ex-check {
  width:28px; height:28px;
  border-radius:50%;
  border:2px solid var(--border);
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.ex-list-item.completed .ex-check {
  border-color:var(--accent);
  background:var(--accent);
  color:var(--bg);
}

/* FULL SCREEN EXERCISE CARD */
.exercise-fullscreen {
  position:fixed;
  inset:0;
  background:var(--bg);
  z-index:200;
  display:none;
  flex-direction:column;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.exercise-fullscreen.active { display:flex; }
.ef-header {
  padding:calc(16px + var(--safe-top)) 16px 16px;
  display:flex;
  align-items:center;
  gap:14px;
  background:rgba(10,10,10,0.95);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  position:sticky;
  top:0;
  z-index:10;
}
.ef-back {
  width:48px; height:48px;
  border-radius:12px;
  background:var(--surface2);
  border:none;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  font-size:24px;
}
.ef-header-info { flex:1; }
.ef-header-info .ef-exnum { font-size:16px; color:var(--text3); }
.ef-header-info .ef-exname { font-size:28px; font-weight:700; }
.ef-body { flex:1; padding:20px 16px calc(20px + var(--safe-bottom)); }
.ef-actions { display:flex; gap:10px; margin-bottom:14px; }
.ef-action-btn {
  flex:1;
  padding:16px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:17px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
}
.ef-action-btn:active { background:var(--surface2); }
.ef-action-btn svg { width:20px; height:20px; }

.ef-section-title {
  font-size:18px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--text2);
  margin-bottom:8px;
}

/* SET ROWS */
.set-row {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  padding:10px 14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
}
.set-label {
  font-family:'Space Mono',monospace;
  font-size:22px;
  font-weight:700;
  color:var(--text);
  width:28px;
  flex-shrink:0;
  white-space:nowrap;
}
.set-reps {
  font-size:22px;
  color:var(--text2);
  width:36px;
  flex-shrink:0;
}
.set-prev {
  font-size:22px;
  color:var(--text3);
  width:50px;
  flex-shrink:0;
  text-align:center;
}
.set-prev .prev-val { color:var(--text); font-weight:600; }
.set-input {
  flex:1;
  height:52px;
  border-radius:12px;
  border:2px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  font-family:'Space Mono',monospace;
  font-size:32px;
  font-weight:700;
  text-align:center;
  outline:none;
  -webkit-appearance:none;
  min-width:0;
}
.set-input:focus { border-color:var(--accent); background:var(--accent-dim); }
.set-input::placeholder { color:var(--text3); font-size:18px; font-weight:400; }
.set-header {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
  padding:0 14px;
}
.set-header span {
  font-size:14px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:var(--text3);
}
.set-header .sh-set { width:28px; }
.set-header .sh-reps { width:36px; }
.set-header .sh-prev { width:50px; text-align:center; }
.set-header .sh-weight { flex:1; text-align:center; }

.ef-save-btn {
  width:100%;
  padding:18px;
  border-radius:var(--radius);
  border:none;
  background:var(--accent);
  color:var(--bg);
  font-family:'DM Sans',sans-serif;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
  margin-top:12px;
}
.ef-save-btn:active { background:var(--accent2); }

/* NAV DOTS */
.ef-nav {
  display:flex;
  justify-content:center;
  gap:16px;
  padding:16px 0 0;
}
.ef-nav-btn {
  width:56px; height:56px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.ef-nav-btn:active { background:var(--surface2); }
.ef-nav-btn:disabled { opacity:0.3; }

/* MODAL */
.modal-overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  z-index:300;
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.modal-overlay.active { display:flex; }
.modal-sheet {
  width:100%;
  max-width:600px;
  max-height:85vh;
  background:var(--surface);
  border-radius:var(--radius) var(--radius) 0 0;
  padding:20px 20px calc(20px + var(--safe-bottom));
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.modal-handle {
  width:36px; height:4px;
  background:var(--text3);
  border-radius:2px;
  margin:0 auto 16px;
}
.modal-title { font-size:24px; font-weight:700; margin-bottom:4px; }
.modal-alt { font-size:15px; color:var(--accent); margin-bottom:12px; }
.modal-desc { font-size:16px; color:var(--text2); line-height:1.6; margin-bottom:16px; }
.modal-cues { margin-bottom:16px; }
.modal-cues .cue {
  display:flex; gap:8px; margin-bottom:8px;
  font-size:15px; color:var(--text2); line-height:1.5;
}
.modal-cues .cue-dot {
  width:6px; height:6px;
  border-radius:50%;
  background:var(--accent);
  margin-top:6px;
  flex-shrink:0;
}
.modal-video-btn {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  padding:14px;
  border-radius:var(--radius-sm);
  border:none;
  background:#ff0000;
  color:#fff;
  font-family:'DM Sans',sans-serif;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  text-decoration:none;
}
.modal-close {
  width:100%;
  padding:14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:16px;
  font-weight:500;
  cursor:pointer;
  margin-top:10px;
}

/* BACK NAV */
.back-row {
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:16px;
  cursor:pointer;
  color:var(--accent);
  font-size:16px;
  font-weight:500;
}
.back-row svg { width:18px; height:18px; }

/* PROGRAM TAB */
.prog-section { margin-bottom:24px; }
.prog-day-title {
  font-size:18px;
  font-weight:700;
  padding:10px 14px;
  background:var(--surface2);
  border-radius:var(--radius-sm) var(--radius-sm) 0 0;
  border:1px solid var(--border);
  border-bottom:none;
  display:flex;
  align-items:center;
  gap:10px;
}
.prog-day-title svg { width:22px; height:22px; flex-shrink:0; }
.prog-table {
  border:1px solid var(--border);
  border-radius:0 0 var(--radius-sm) var(--radius-sm);
  overflow:hidden;
}
.prog-row {
  display:grid;
  grid-template-columns:28px 1fr 44px 50px;
  padding:10px 12px;
  border-bottom:1px solid var(--border);
  font-size:15px;
  align-items:center;
}
.prog-row:last-child { border-bottom:none; }
.prog-row.header {
  background:var(--surface2);
  font-weight:600;
  color:var(--text3);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.prog-row .pr-num { color:var(--text3); font-family:'Space Mono',monospace; }
.prog-row .pr-name { font-weight:500; }
.prog-row .pr-alt { color:var(--accent); font-size:13px; }
.prog-row .pr-sets, .prog-row .pr-reps { text-align:center; color:var(--text2); }

/* WEEK HEADER PILLS */
.prog-week-header {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:4px 0 12px;
}
.prog-week-pill {
  padding:8px 10px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text2);
  font-size:15px;
  font-weight:500;
  white-space:nowrap;
  cursor:pointer;
  flex:1;
  text-align:center;
}
.prog-week-pill.active {
  background:var(--accent-dim);
  border-color:var(--accent);
  color:var(--accent);
}

/* ALL EXERCISES TAB */
.all-ex-item {
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  margin-bottom:10px;
  cursor:pointer;
  transition:background 0.15s;
}
.all-ex-item:active { background:var(--surface2); }
.all-ex-item .aex-name { flex:1; font-size:18px; font-weight:500; }
.all-ex-item .aex-tag {
  font-size:13px;
  padding:3px 8px;
  border-radius:6px;
  font-weight:500;
}
.all-ex-item .aex-tag.shoulder { background:var(--accent-dim); color:var(--accent); }
.all-ex-item .aex-tag.cardio { background:var(--blue-dim); color:var(--blue); }

/* HISTORY TAB */
.hist-table {
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  overflow:hidden;
  margin-bottom:16px;
}
.hist-row {
  display:grid;
  grid-template-columns:1fr 80px 70px;
  padding:10px 12px;
  border-bottom:1px solid var(--border);
  font-size:15px;
}
.hist-row:last-child { border-bottom:none; }
.hist-row.header {
  background:var(--surface2);
  font-weight:600;
  color:var(--text3);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.5px;
}

.export-btn {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  padding:14px;
  border-radius:var(--radius);
  border:1px solid var(--accent);
  background:var(--accent-dim);
  color:var(--accent);
  font-family:'DM Sans',sans-serif;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:16px;
}

/* SEARCH */
.search-box {
  width:100%;
  padding:14px 16px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-family:'DM Sans',sans-serif;

<div class="app" id="app"></div>

<script>
// ============================================================
// PCYC GYM TRACKER - Full App
// ============================================================

// --- DATA ---
const STORAGE_KEY = 'pcyc_gym_data';

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
}
function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function getWeightLog() {
  const d = loadData();
  return d.weights || {};
}
// Weight saving - saves once per exercise per date+slot, locked after save unless overwrite=true
function saveWeights(exerciseId, meta, date, sets, overwrite) {
  const d = loadData();
  if (!d.weights) d.weights = {};
  if (!d.weights[exerciseId]) d.weights[exerciseId] = [];
  const existingIdx = d.weights[exerciseId].findIndex(e =>
    e.cycleWeek === meta.cycleWeek && e.day === meta.day && e.slot === meta.slot && !e.reset);
  if (existingIdx !== -1) {
    if (!overwrite) return;
    d.weights[exerciseId][existingIdx].sets = sets;
    d.weights[exerciseId][existingIdx].date = date;
    saveData(d);
    return;
  }
  d.weights[exerciseId].push({ date, sets, cycleWeek: meta.cycleWeek, day: meta.day, slot: meta.slot, deload: !!meta.deload });
  saveData(d);
}
function getTodaysWeights(exerciseId) {
  const today = todayStr();
  const w = getWeightLog()[exerciseId];
  if (!w) return null;
  return w.find(e => e.date === today && !e.reset) || null;
}
function getLastWeights(exerciseId, skipDeload, excludeToday) {
  const w = getWeightLog()[exerciseId];
  if (!w || w.length === 0) return null;
  const today = todayStr();
  let entries = w.filter(e => !e.reset).sort((a,b) => new Date(b.date) - new Date(a.date));
  if (excludeToday) {
    entries = entries.filter(e => e.date !== today);
  }
  if (skipDeload) {
    entries = entries.filter(e => !e.deload);
  }
  return entries.length > 0 ? entries[0] : null;
}
function getAllWeights(exerciseId) {
  const w = getWeightLog()[exerciseId];
  if (!w) return [];
  return w.sort((a,b) => new Date(b.date) - new Date(a.date));
}

function entryTagLabel(e) {
  if (e.cycleWeek) {
    const dayName = e.day ? (programDays[e.day] ? programDays[e.day].name : e.day) : '';
    return 'Week ' + e.cycleWeek + (dayName ? ' · ' + dayName : '') + (e.deload ? ' · Deload' : '');
  }
  if (e.intensity) return e.intensity; // very old entries, pre-redesign
  if (e.week) return 'Week ' + e.week; // older Tim-week entries, pre-redesign
  return '';
}
function formatSetsHtml(sets) {
  if (!sets || sets.length === 0) return '';
  // Cardio: first value is a machine name string
  if (sets[0] && isNaN(sets[0]) && !sets[0].includes(':')) {
    return '<span class="hist-entry-set">' + sets[0] + ' — ' + (sets[1]||'?') + ' min</span>';
  }
  // DB exercises: values contain ":"
  if (sets[0] && sets[0].includes && sets[0].includes(':')) {
    return sets.map((s,i) => {
      const parts = s.split(':');
      return '<span class="hist-entry-set">S'+(i+1)+': '+parts[0]+'L / '+parts[1]+'R</span>';
    }).join('');
  }
  // Standard: just kg values
  return sets.map((s,i) => '<span class="hist-entry-set">S'+(i+1)+': '+s+'kg</span>').join('');
}

// Progress chart for an exercise's history. Tracks your heaviest single set
// per session (the usual way to gauge strength trend). Deload sessions are
// marked with a distinct colour/marker so a planned lighter week never reads
// as a regression.
function buildWeightChart(entries, isDB) {
  const chrono = entries.filter(e => !e.reset).slice().sort((a,b) => new Date(a.date) - new Date(b.date));
  if (chrono.length === 0) return '';

  function topOf(sets) {
    let max = null;
    sets.forEach(s => { const n = parseFloat(s); if (!isNaN(n) && (max === null || n > max)) max = n; });
    return max;
  }
  function topLR(sets) {
    let maxL = null, maxR = null;
    sets.forEach(s => {
      if (typeof s !== 'string' || !s.includes(':')) return;
      const parts = s.split(':');
      const nl = parseFloat(parts[0]), nr = parseFloat(parts[1]);
      if (!isNaN(nl) && (maxL === null || nl > maxL)) maxL = nl;
      if (!isNaN(nr) && (maxR === null || nr > maxR)) maxR = nr;
    });
    return { maxL, maxR };
  }

  let seriesL, seriesR = null;
  if (isDB) {
    seriesL = chrono.map(e => ({ date: e.date, val: topLR(e.sets).maxL, deload: !!e.deload })).filter(p => p.val !== null);
    seriesR = chrono.map(e => ({ date: e.date, val: topLR(e.sets).maxR, deload: !!e.deload })).filter(p => p.val !== null);
  } else {
    seriesL = chrono.map(e => ({ date: e.date, val: topOf(e.sets), deload: !!e.deload })).filter(p => p.val !== null);
  }
  if (seriesL.length === 0) return '';

  const allVals = seriesL.concat(seriesR || []).map(p => p.val);
  let minV = Math.min(...allVals), maxV = Math.max(...allVals);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const pad = (maxV - minV) * 0.2;
  minV -= pad; maxV += pad;

  const W = 300, H = 140, padX = 10, padY = 14;
  const plotW = W - padX * 2, plotH = H - padY * 2;
  function xFor(i, n) { return n <= 1 ? padX + plotW / 2 : padX + (i / (n - 1)) * plotW; }
  function yFor(v) { return padY + plotH - ((v - minV) / (maxV - minV)) * plotH; }

  function pathFor(pts) {
    return pts.map((p, i) => (i === 0 ? 'M' : 'L') + xFor(i, pts.length).toFixed(1) + ',' + yFor(p.val).toFixed(1)).join(' ');
  }
  function dotsFor(pts, color) {
    return pts.map((p, i) => {
      const x = xFor(i, pts.length).toFixed(1), y = yFor(p.val).toFixed(1);
      const fill = p.deload ? 'var(--orange)' : color;
      const r = p.deload ? 4.5 : 3.5;
      return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" stroke="var(--bg)" stroke-width="1.5"/>';
    }).join('');
  }

  let svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:140px;display:block">';
  svg += '<line x1="'+padX+'" y1="'+(H-padY)+'" x2="'+(W-padX)+'" y2="'+(H-padY)+'" stroke="var(--border)" stroke-width="1"/>';
  svg += '<path d="'+pathFor(seriesL)+'" fill="none" stroke="var(--accent)" stroke-width="2"/>';
  svg += dotsFor(seriesL, 'var(--accent)');
  if (seriesR) {
    svg += '<path d="'+pathFor(seriesR)+'" fill="none" stroke="var(--blue)" stroke-width="2"/>';
    svg += dotsFor(seriesR, 'var(--blue)');
  }
  svg += '</svg>';

  const legend = '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin-top:6px">'
    + '<span><span class="chart-dot" style="background:var(--accent)"></span>' + (isDB ? 'Left' : 'Top set') + '</span>'
    + (isDB ? '<span><span class="chart-dot" style="background:var(--blue)"></span>Right</span>' : '')
    + '<span><span class="chart-dot" style="background:var(--orange)"></span>Deload week</span>'
    + '</div>';

  return svg + legend;
}

// Halve a rep target for the deload week, preserving any suffix like 'ea' or 'min'.
function deloadRepsFor(r) {
  if (!r || typeof r !== 'string') return r;
  if (r.includes('min')) return r; // cardio duration untouched
  const m = r.match(/^(\d+)(.*)$/);
  if (!m) return r;
  const num = parseInt(m[1]);
  const half = Math.max(1, Math.round(num / 2));
  return half + m[2];
}

// 4-week repeating cycle: position 1=A, 2=B, 3=A, 4=B+Deload.
function cyclePosForWeek(w) { return ((w - 1) % 4) + 1; }
function variantForWeek(w) { const p = cyclePosForWeek(w); return (p === 1 || p === 3) ? 'a' : 'b'; }
function isDeloadWeek(w) { return cyclePosForWeek(w) === 4; }

// A natural deload week can be manually overridden off (e.g. a missed week
// already gave you the recovery a deload was for) - or restored back.
function getEffectiveDeload(cycleWeek) {
  const d = loadData();
  if (d.deloadOverrides && d.deloadOverrides[cycleWeek] !== undefined) return d.deloadOverrides[cycleWeek];
  return isDeloadWeek(cycleWeek);
}
function setDeloadOverride(cycleWeek, value) {
  const d = loadData();
  if (!d.deloadOverrides) d.deloadOverrides = {};
  if (value === null) delete d.deloadOverrides[cycleWeek];
  else d.deloadOverrides[cycleWeek] = value;
  saveData(d);
}

    entries.forEach(e => {
      if (e.reset) return;
      if (!maxDate || new Date(e.date) > new Date(maxDate)) maxDate = e.date;
    });
  });
  if (!maxDate) return null;
  return Math.round((new Date(todayStr()) - new Date(maxDate)) / 86400000);
}

function getProgress() {
  const d = loadData();
  return d.progress || { cycleWeek: 1, daysDone: [] };
}
function saveProgress(progress) {
  const d = loadData();
  d.progress = progress;
  saveData(d);
}
// A day only "advances" the program once you've done at least one of the 3
// sessions this cycle-week. Miss a whole week and it just waits for you.
function canAdvanceWeek() {
  const p = getProgress();
  return p.daysDone.length > 0 || getWeekDoneCount(p.cycleWeek) > 0;
}
function advanceWeek() {
  const p = getProgress();
  p.cycleWeek += 1;
  p.daysDone = [];
  p.weekStart = mondayOf(todayStr());
  saveProgress(p);
}
// Manually point "current week" at any week (e.g. to redo or jump ahead).
function setCurrentWeek(w) {
  const p = getProgress();
  p.cycleWeek = w;
  p.daysDone = [];
  p.weekStart = mondayOf(todayStr()); // don't let auto-advance undo this until next calendar week
  saveProgress(p);
}

// Monday (local) of the calendar week containing a 'YYYY-MM-DD' date.
function mondayOf(dateStr) {
  const [y, m, dd] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, dd);
  dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}
// Latest logged date for a cycle-week in raw data, or null if nothing logged.
function latestDateForWeek(d, cycleWeek) {
  let latest = null;
  Object.values(d.weights || {}).forEach(entries => {
    entries.forEach(e => {
      if (e.reset || e.cycleWeek !== cycleWeek) return;
      if (!latest || e.date > latest) latest = e.date;
    });
  });
  return latest;
}
// Once per calendar week (Mon-Sun): if the current program week has any
// logged session from an earlier calendar week, it's finished, so move on.
// Keeps moving past any following weeks that are also already finished
// (catch-up). A week with nothing logged just waits - never skipped.
function autoAdvanceWeeks(d, today) {
  const thisMon = mondayOf(today);
  const p = d.progress || { cycleWeek: 1, daysDone: [] };
  if (p.weekStart === thisMon) return false;
  let guard = 0;
  while (guard++ < 1000) {
    const latest = latestDateForWeek(d, p.cycleWeek);
    if (latest && latest < thisMon) { p.cycleWeek += 1; p.daysDone = []; }
    else break;
  }
  p.weekStart = thisMon;
  d.progress = p;
  return true;
}

// Substitutions: which exercise you actually picked for a given cycle-week +
// day + slot, if different from the program default.
function getSubstitution(cycleWeek, day, slot) {
  const d = loadData();
  const key = cycleWeek + '_' + day;
  return (d.substitutions && d.substitutions[key]) ? d.substitutions[key][slot] : null;
}
function setSubstitution(cycleWeek, day, slot, exId) {
  const d = loadData();
  if (!d.substitutions) d.substitutions = {};
  const key = cycleWeek + '_' + day;
  if (!d.substitutions[key]) d.substitutions[key] = {};
  d.substitutions[key][slot] = exId;
  saveData(d);
}
function getActualIdForSlot(day, cycleWeek, slot) {
  const sub = getSubstitution(cycleWeek, day, slot);
  if (sub) return sub;
  const variant = variantForWeek(cycleWeek);
  return pickVariantId(programDays[day].exercises[slot], variant);
}
function getRepsForSlot(day, cycleWeek, slot) {
  const ex = programDays[day].exercises[slot];
  return getEffectiveDeload(cycleWeek) ? deloadRepsFor(ex.r) : ex.r;
}

// Find a logged entry for a given cycle-week/day/slot, regardless of which
// exercise id it ended up saved under (handles substitutions robustly).
function findSlotEntry(cycleWeek, day, slot) {
  const log = getWeightLog();
  for (const exId in log) {
    const found = log[exId].find(e => e.cycleWeek === cycleWeek && e.day === day && e.slot === slot && !e.reset);
    if (found) return { exId, entry: found };
  }
  return null;
}

// --- SESSION / DAY STATE ---
function getActiveSession() {
  const d = loadData();
  return d.activeSession || null;
}
function setActiveSession(session) {
  const d = loadData();
  d.activeSession = session;
  saveData(d);
}
function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function startSession(day, cycleWeek) {
  setActiveSession({ day, cycleWeek, date: todayStr() });
}

// Key for in-progress, unsaved input drafts - so navigating away and back
// (or to a different exercise) before hitting Save never loses what you typed.
// Drafts are persisted to storage (not just in-memory) so they survive the
// app being fully closed, not just backgrounded.
function draftKeyFor(ctx) {
  return ctx ? (ctx.cycleWeek + '_' + ctx.day + '_' + ctx.slot) : null;
}
function getDraft(key) {
  if (!key) return {};
  const d = loadData();
  return (d.drafts && d.drafts[key]) || {};
}
function updateDraft(key, updater) {
  if (!key) return;
  const d = loadData();
  if (!d.drafts) d.drafts = {};
  if (!d.drafts[key]) d.drafts[key] = {};
  updater(d.drafts[key]);
  saveData(d);
}
function clearDraft(key) {
  if (!key) return;
  const d = loadData();
  if (d.drafts && d.drafts[key]) {
    delete d.drafts[key];
    saveData(d);
  }
}

// Commit one draft's typed-but-unsaved values into real, permanent data.
// Mutates the raw data object in place; caller is responsible for saveData().
function commitDraftToData(d, key, draft) {
  const parts = key.split('_');
  const cycleWeek = parseInt(parts[0]);
  const day = parts[1];
  const slot = parseInt(parts[2]);
  const dd = programDays[day];
  if (!dd || !dd.exercises[slot]) return;
  const exDef = dd.exercises[slot];
  const subs = (d.substitutions && d.substitutions[cycleWeek + '_' + day]) || {};
  const exId = subs[slot] || pickVariantId(exDef, variantForWeek(cycleWeek));
  const isCardioSlot = exId === 'cardio';

  let sets = null;
  if (isCardioSlot) {
    if (draft.machine) sets = [draft.machine, draft.duration || '10'];
  } else if (draft.sets && draft.sets.some(s => s !== undefined && s !== '' && s !== ':')) {
    sets = draft.sets.map(s => s === undefined ? '' : s);
  }
  if (!sets) return; // nothing meaningful was actually typed

  if (!d.weights) d.weights = {};
  if (!d.weights[exId]) d.weights[exId] = [];
  const existingIdx = d.weights[exId].findIndex(e => e.cycleWeek === cycleWeek && e.day === day && e.slot === slot && !e.reset);
  if (existingIdx !== -1) {
    // Editing an already-saved entry - keep its original date, just update the values
    d.weights[exId][existingIdx].sets = sets;
  } else {
    // A brand new entry that was never explicitly saved - date it to when it
    // was actually being worked on (the session's date), not "today" (the new day).
    const dateToUse = (d.activeSession && d.activeSession.day === day && d.activeSession.cycleWeek === cycleWeek)
      ? d.activeSession.date
      : (d.lastSeenDate || todayStr());
    d.weights[exId].push({ date: dateToUse, sets, cycleWeek, day, slot, deload: getEffectiveDeload(cycleWeek) });
  }
}

// Runs on every render. Detects whether a new calendar day has begun since
// the app was last open. If so: any unsaved drafts (a session left mid-way
// without saving, or a locked day that was being edited but not re-saved)
// get auto-committed as final data - nothing typed is silently lost. Then
// the stale active session (if any) gets locked in as before.
function checkDayRollover() {
  const d = loadData();
  const today = todayStr();
  const newDay = d.lastSeenDate !== today;

  if (newDay) {
    if (d.drafts) {
      Object.entries(d.drafts).forEach(([key, draft]) => commitDraftToData(d, key, draft));
      d.drafts = {};
    }

    if (d.activeSession && d.activeSession.date !== today) {
      const p = d.progress || { cycleWeek: 1, daysDone: [] };
      if (p.cycleWeek === d.activeSession.cycleWeek) {
        const dd = programDays[d.activeSession.day];
        const hasAnyData = dd.exercises.some((ex, slot) =>
          Object.values(d.weights || {}).some(entries =>
            entries.some(e => !e.reset && e.cycleWeek === p.cycleWeek && e.day === d.activeSession.day && e.slot === slot)));
        if (hasAnyData && !p.daysDone.includes(d.activeSession.day)) {
          p.daysDone.push(d.activeSession.day);
        }
        d.progress = p;
      }
      d.activeSession = null;
    }
  }

  // New calendar week (or first run after this feature shipped)? Roll the
  // program forward past any finished weeks. Runs after drafts are committed
  // so nothing typed counts as "empty".
  const advanced = autoAdvanceWeeks(d, today);

  if (!newDay && !advanced) return;

  d.lastSeenDate = today;
  saveData(d);

  if (advanced) {
    state.viewCycle = null;
    state.view = 'weekPicker';
    state.selectedWeek = null;
    state.selectedDay = null;
    state.selectedExercise = null;
  }

  // Any in-progress edit is now finalized - drop back to a clean locked view
  if (newDay) {
    state.editingLockedSession = false;
    state.editingExercise = false;
  }
}

// Status of a day for a GIVEN week (not just current): 'active' (open today),
// 'locked' (has real logged data - view/edit), or 'not_started'.
function getDayStatus(day, cycleWeek) {
  const p = getProgress();
  if (cycleWeek === undefined) cycleWeek = p.cycleWeek;
  const s = getActiveSession();
  if (s && s.day === day && s.cycleWeek === cycleWeek && s.date === todayStr()) return 'active';
  if (cycleWeek === p.cycleWeek && p.daysDone.includes(day)) return 'locked';
  const dd = programDays[day];
  const hasAnyData = dd.exercises.some((ex, slot) => !!findSlotEntry(cycleWeek, day, slot));
  if (hasAnyData) return 'locked';
  return 'not_started';
}

// Quick summary for the week list: how many of the 3 sessions have real data.
function getWeekDoneCount(cycleWeek) {
  return dayOrder.filter(day => getDayStatus(day, cycleWeek) === 'locked' || getDayStatus(day, cycleWeek) === 'active').length;
}

// --- APP STATE ---
let state = {
  activeTab: 'today',
  view: 'weekPicker', // weekPicker -> dayPicker -> day -> exercise fullscreen (separate overlay)
  selectedWeek: null,
  selectedDay: null,
  viewCycle: null, // null = follow the current cycle; else a cycle number being browsed
  editingLockedSession: false, // true once "Edit" tapped on a locked day
  selectedExercise: null,
  selectedExerciseContext: null, // {day, cycleWeek, slot}
  allExSearch: '',
  historyExercise: null,
  // drafts now live in persistent storage (see getDraft/updateDraft/clearDraft), not here
  swapPickerOpen: false,
  swapSearch: ''
};

// --- RENDER ---
function render() {
  checkDayRollover();

    ${renderPage()}

    ${renderModal()}
  `;
  bindEvents();
}

// --- TODAY / ROUTINE PAGE ---
function renderTodayPage() {
  if (state.view === 'day' && state.selectedDay) return renderDayView();
  if (state.view === 'dayPicker' && state.selectedWeek) return renderDayPicker();
  return renderWeekPicker();
}

// Which pass through the 4-week template we're currently on, and which
// absolute week number that cycle started at (e.g. Cycle 3 = weeks 9-12).
function getCurrentCycleInfo() {
  const cw = getProgress().cycleWeek;
  const currentCycle = Math.floor((cw - 1) / 4) + 1;
  const cycleNumber = Math.max(1, state.viewCycle || currentCycle);
  const cycleStartWeek = (cycleNumber - 1) * 4 + 1;
  return { cycleNumber, cycleStartWeek, currentCycle };
}

function renderWeekPicker() {
  const p = getProgress();

    ${Array.from({length: 4}, (_, i) => i + 1).map(templatePos => {
      const w = cycleStartWeek + templatePos - 1;

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>

    ${currentCycle > 1 ? `<div style="text-align:center;color:var(--text3);font-size:13px;padding:12px 0">You've completed ${currentCycle - 1} full cycle${currentCycle-1===1?'':'s'} so far</div>` : ''}
  </div>`;
}

function renderDayPicker() {
  const cw = state.selectedWeek;
  const p = getProgress();
  const isCurrent = cw === p.cycleWeek;
  const variant = variantForWeek(cw);
  const natural = isDeloadWeek(cw);
  const deload = getEffectiveDeload(cw);
  const canAdvance = isCurrent && canAdvanceWeek();

  return `<div class="page active fade-in">

  </div>`;
}

function renderDayView() {
  const day = state.selectedDay;

    </div>
    <div class="page-sub">${status === 'not_started' ? 'Tap an exercise to start' : status === 'active' ? 'In progress — locks once you come back a different day' : (editing ? 'Editing — Save to lock again' : 'Locked — tap Edit to change')}${deload ? ' · Deload' : ''}</div>

    ${dd.exercises.map((ex, slot) => {
      const exId = getActualIdForSlot(day, cycleWeek, slot);
      const exData = exercises[exId];

      const reps = deload ? deloadRepsFor(ex.r) : ex.r;
      const found = findSlotEntry(cycleWeek, day, slot);

      const isSubstituted = exId !== pickVariantId(ex, variantForWeek(cycleWeek));
      return `<div class="ex-list-item ${done?'completed':''} ${skipped?'skipped-item':''}" data-action="${editing ? 'openExercise' : 'showInfo'}" data-exid="${exId}" data-slot="${slot}" data-day="${day}" data-cycleweek="${cycleWeek}">        <div class="ex-check">${done?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':(skipped?'—':'')}</div>
        <div class="ex-num">${slot+1}</div>
        <div class="ex-name">${exData.name}${isSubstituted?' <span class="pr-alt" style="font-size:11px">(swapped)</span>':''}${skipped?' <span style="color:var(--text3);font-size:12px">Skipped</span>':''}</div>
        <div class="ex-sets-info">${isCardio ? '10 min' : ex.s+'×'+reps}</div>

      </div>`;
    }).join('')}
  </div>`;
}

// --- EXERCISE FULLSCREEN ---
function renderExerciseFullscreen() {
  if (!state.selectedExercise) return '<div class="exercise-fullscreen"></div>';
  const exId = state.selectedExercise;
  const ex = exercises[exId];
  const ctx = state.selectedExerciseContext;
  const dd = ctx ? programDays[ctx.day] : null;
  const exDef = dd ? dd.exercises[ctx.slot] : null;
  const deload = ctx ? getEffectiveDeload(ctx.cycleWeek) : false;
  const reps = exDef ? (deload ? deloadRepsFor(exDef.r) : exDef.r) : '?';
  const wd = exDef ? { s: exDef.s, r: reps } : { s: 3, r: '?' };
  const numSets = wd.s || 0;

  const status = ctx ? getDayStatus(ctx.day, ctx.cycleWeek) : 'not_started';
  const viewOnly = status === 'locked' && !state.editingLockedSession;

  // Prev weights: most recent OTHER logged entry for this exercise (excluding this exact slot), skip deload
  const otherEntries = (getWeightLog()[exId] || []).filter(e => !e.reset && !e.deload &&
    !(ctx && e.cycleWeek === ctx.cycleWeek && e.day === ctx.day && e.slot === ctx.slot))
    .sort((a,b) => new Date(b.date) - new Date(a.date));
  const last = otherEntries.length > 0 ? otherEntries[0] : null;
  const prevSets = last ? last.sets : [];
  // This slot's saved entry, if any
  const slotFound = ctx ? findSlotEntry(ctx.cycleWeek, ctx.day, ctx.slot) : null;
  const savedHere = !!slotFound;
  const todaysSets = slotFound ? slotFound.entry.sets : [];
  // Any unsaved draft (typed but not yet saved) for this exact slot
  const draft = getDraft(draftKeyFor(ctx));
  const hasDraft = !!(draft.sets && draft.sets.some(s => s !== undefined && s !== '')) || !!draft.machine || !!draft.duration;

  const isCardio = ex.isCardio;
  const isDB = ex.isDB;

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
          ${ex.cardioOptions.map(opt => `
            <button class="cardio-opt ${draft.machine===opt?'selected':''}" data-action="selectCardio" data-machine="${opt}">${opt}</button>

        <div class="set-row">
          <div class="set-label" style="width:auto">Time</div>

          <span class="sh-set">Set</span>
          <span class="sh-reps">Reps</span>
          <span class="sh-prev">Prev</span>

        </div>
        ${Array.from({length:numSets}, (_,i) => {
          const prevW = prevSets[i] || '';
          const todayW = todaysSets[i] || '';
          const prevDisplay = isDB && prevW ? prevW.replace(':', ' / ') : prevW;

          if (isDB) {

            return `<div class="set-row">

// --- CSV EXPORT ---
function exportCSV() {
  const allWeights = getWeightLog();
  let csv = 'Exercise,Date,Intensity,Set 1,Set 1 L,Set 1 R,Set 2,Set 2 L,Set 2 R,Set 3,Set 3 L,Set 3 R,Set 4,Set 4 L,Set 4 R,Type\n';
  Object.entries(allWeights).forEach(([exId, entries]) => {
    const ex = exercises[exId];
    const name = ex ? ex.name : exId;
    const type = ex && ex.isCardio ? 'cardio' : ex && ex.isDB ? 'dumbbell' : 'barbell';
    entries.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(e => {
      const cols = [];
      for (let i = 0; i < 4; i++) {
        const val = e.sets[i] || '';
        if (val.includes && val.includes(':')) {
          const parts = val.split(':');
          cols.push('', parts[0]||'', parts[1]||'');
        } else {
          cols.push(val, '', '');
        }
      }
      csv += `"${name}",${e.date},${entryTagLabel(e)},${cols.join(',')},${type}\n`;
    });
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pcyc_gym_log_'+todayStr()+'.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function exportJSON() {
  const data = loadData();
  data._exportDate = new Date().toISOString();
  data._appVersion = 'PCYC Gym Tracker v1';
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pcyc_gym_backup_'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.weights) {
        alert('This file does not appear to be a valid PCYC Gym backup.');
        return;
      }
      if (confirm('This will replace all current data with the imported backup. Continue?')) {
        // Merge: keep existing structure, overwrite with imported
        saveData(data);
        render();
        alert('Data imported successfully.');
      }
    } catch(err) {
      alert('Could not read file. Make sure it is a valid JSON backup.');
    }
  };
  reader.readAsText(file);
}

// --- EVENT BINDING ---
function bindEvents() {
  // Tab buttons (these are re-created each render so need fresh listeners)
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const newTab = btn.dataset.tab;
      if (newTab !== 'today') {
        // Switching to a non-routine tab — close any open exercise/modal but keep view state
        state.selectedExercise = null;
        state.editingExercise = false;
      }
      state.activeTab = newTab;
      state.historyExercise = null;
      modalExId = null;
      modalMode = null;
      render();
    });
  });
  // Document-level listeners are bound once below, not here
}

function handleAction(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  // Prevent parent action from also firing for nested buttons
  if (action === 'showInfo' || action === 'showExHistory') {
    e.preventDefault();
    e.stopImmediatePropagation();
  }

  // For closeModal on the overlay, ignore if the click was inside the sheet content (not on a button)
  if (action === 'closeModal') {
    const sheet = e.target.closest('[data-modal-sheet]');
    const clickedButton = e.target.closest('button, a');
    if (sheet && !clickedButton) return; // clicked inside sheet but not on a button, ignore
  }

  switch(action) {
    case 'selectWeek':
      state.selectedWeek = parseInt(el.dataset.week);
      state.view = 'dayPicker';
      render();
      break;
    case 'backToWeeks':
      state.view = 'weekPicker';
      state.selectedWeek = null;
      state.selectedDay = null;
      render();
      break;
    case 'backToDays':
      state.view = 'dayPicker';
      state.selectedDay = null;
      state.selectedExercise = null;
      state.editingLockedSession = false;
      render();
      break;
    case 'selectDay':
      state.selectedDay = el.dataset.daykey;
      state.view = 'day';
      state.editingLockedSession = false;
      render();
      break;
    case 'advanceWeek':
      advanceWeek();
      state.view = 'weekPicker';
      state.selectedWeek = null;
      state.viewCycle = null;
      render();
      break;
    case 'setCurrentWeek':
      setCurrentWeek(parseInt(el.dataset.week));
      state.view = 'weekPicker';
      state.selectedWeek = null;
      state.selectedDay = null;
      state.viewCycle = null;
      render();
      break;
    case 'prevCycle': {
      const ci = getCurrentCycleInfo();
      state.viewCycle = Math.max(1, ci.cycleNumber - 1);
      render();
      break;
    }
    case 'nextCycle': {
      const ci = getCurrentCycleInfo();
      state.viewCycle = ci.cycleNumber + 1;
      if (state.viewCycle === ci.currentCycle) state.viewCycle = null;
      render();
      break;
    }
    case 'backToCurrentCycle':
      state.viewCycle = null;
      render();
      break;
    case 'skipDeload':
      setDeloadOverride(parseInt(el.dataset.week), false);
      render();
      break;
    case 'restoreDeload':
      setDeloadOverride(parseInt(el.dataset.week), null);
      render();
      break;
    case 'editLockedSession':
      state.editingLockedSession = true;
      render();
      break;
    case 'noop':
      break;
    case 'openExercise': {
      const day = el.dataset.day;
      const slot = parseInt(el.dataset.slot);
      const cycleWeek = parseInt(el.dataset.cycleweek);
      // Auto-start the session if this day hasn't been started yet
      if (getDayStatus(day, cycleWeek) === 'not_started') {
        startSession(day, cycleWeek);
      }
      const exId = getActualIdForSlot(day, cycleWeek, slot);
      state.selectedExercise = exId;
      state.selectedExerciseContext = { day, cycleWeek, slot };
      render();
      break;
    }
    case 'closeExercise':
      state.selectedExercise = null;
      state.selectedExerciseContext = null;
      state.editingExercise = false;
      render();
      break;
    case 'prevExercise':
    case 'nextExercise': {
      if (!state.selectedExerciseContext) break;
      state.editingExercise = false;
      const ctx = state.selectedExerciseContext;
      const dd = programDays[ctx.day];
      const newSlot = action === 'prevExercise' ? ctx.slot - 1 : ctx.slot + 1;
      if (newSlot < 0 || newSlot >= dd.exercises.length) break;
      const newExId = getActualIdForSlot(ctx.day, ctx.cycleWeek, newSlot);
      state.selectedExercise = newExId;
      state.selectedExerciseContext = { ...ctx, slot: newSlot };
      render();
      break;
    }
    case 'openSwapPicker':
      state.swapPickerOpen = true;
      state.swapSearch = '';
      render();
      break;
    case 'closeSwapPicker':
      state.swapPickerOpen = false;
      render();
      break;
    case 'searchSwap':
      state.swapSearch = el.value;
      render();
      break;
    case 'chooseSwap': {
      const newExId = el.dataset.exid;
      const ctx = state.selectedExerciseContext;
      if (ctx) {
        setSubstitution(ctx.cycleWeek, ctx.day, ctx.slot, newExId);
        state.selectedExercise = newExId;
      }
      state.swapPickerOpen = false;
      render();
      break;
    }
    case 'saveWeights': {
      const ex = exercises[state.selectedExercise];
      let sets = [];
      if (ex && ex.isDB) {
        const lefts = document.querySelectorAll('.db-left');
        const rights = document.querySelectorAll('.db-right');
        lefts.forEach((inp, i) => {
          const l = inp.value || '';
          const r = rights[i] ? rights[i].value || '' : '';
          sets.push(l + ':' + r);
        });
      } else {
        const inputs = document.querySelectorAll('.set-input:not(.db-left):not(.db-right):not(.cardio-duration)');
        inputs.forEach(inp => {
          sets.push(inp.value || '');
        });
      }
      if (sets.some(s => s !== '' && s !== ':')) {
        const today = todayStr();
        const ctx = state.selectedExerciseContext;
        const meta = { cycleWeek: ctx.cycleWeek, day: ctx.day, slot: ctx.slot, deload: getEffectiveDeload(ctx.cycleWeek) };
        saveWeights(state.selectedExercise, meta, today, sets, state.editingExercise || state.editingLockedSession);
        state.editingExercise = false;
        clearDraft(draftKeyFor(ctx));
        render();
      }
      break;
    }
    case 'editWeights': {
      state.editingExercise = true;
      render();
      break;
    }
    case 'selectCardio': {
      const ctx = state.selectedExerciseContext;
      const key = draftKeyFor(ctx);
      updateDraft(key, d => { d.machine = el.dataset.machine; });
      document.querySelectorAll('.cardio-opt').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.machine === el.dataset.machine);
      });
      break;
    }
    case 'saveCardio': {
      const ctx = state.selectedExerciseContext;
      const key = draftKeyFor(ctx);
      const machine = getDraft(key).machine;
      if (!machine) {
        document.querySelectorAll('.cardio-opt').forEach(btn => {
          btn.style.borderColor = 'var(--red)';
          setTimeout(() => btn.style.borderColor = '', 500);
        });
        break;
      }
      const duration = document.querySelector('.cardio-duration');
      const mins = duration ? duration.value : '10';
      const today = todayStr();
      const meta = { cycleWeek: ctx.cycleWeek, day: ctx.day, slot: ctx.slot, deload: getEffectiveDeload(ctx.cycleWeek) };
      saveWeights(state.selectedExercise, meta, today, [machine, mins], state.editingExercise || state.editingLockedSession);
      clearDraft(key);
      render();
      break;
    }
    case 'showInfo':
      e.stopPropagation();
      modalExId = el.dataset.exid;
      modalMode = 'info';
      render();
      break;
    case 'showExHistory':
      e.stopPropagation();
      modalExId = el.dataset.exid;
      modalMode = 'history';
      render();
      break;
    case 'closeModal':
      modalExId = null;
      modalMode = null;
      render();
      break;
    case 'exportCSV':
      exportCSV();
      break;
    case 'exportJSON':
      exportJSON();
      break;
    case 'importJSON':
      document.getElementById('jsonImportInput').click();
      break;
    case 'resetAllData':
      modalExId = null;
      modalMode = 'confirmResetAll';
      render();
      break;
    case 'confirmResetAll':
      localStorage.removeItem(STORAGE_KEY);
      modalMode = null;
      render();
      break;
    case 'openExFromList': {
      const exId = el.dataset.exid;
      modalExId = exId;
      modalMode = 'info';
      render();
      break;
    }
    case 'viewExHistory':
      state.historyExercise = el.dataset.exid;
      render();
      break;
    case 'backToHistory':
      state.historyExercise = null;
      render();
      break;
  }
}

function handleInput(e) {
  if (e.target.dataset.action === 'searchExercises') {
    state.allExSearch = e.target.value;
    clearTimeout(handleInput._t);
    handleInput._t = setTimeout(() => render(), 150);
    return;
  }
  if (e.target.dataset.action === 'searchSwap') {
    state.swapSearch = e.target.value;
    clearTimeout(handleInput._t2);
    handleInput._t2 = setTimeout(() => render(), 150);
    return;
  }
  // Weight/cardio inputs on the exercise fullscreen - save into a persisted
  // draft so navigating away (or even closing the app) before tapping Save
  // never loses what was typed.
  const ctx = state.selectedExerciseContext;
  const key = draftKeyFor(ctx);
  if (!key) return;

  if (e.target.classList.contains('cardio-duration')) {
    updateDraft(key, d => { d.duration = e.target.value; });
  } else if (e.target.classList.contains('db-left') || e.target.classList.contains('db-right')) {
    const i = parseInt(e.target.dataset.set);
    const side = e.target.dataset.side;
    updateDraft(key, d => {
      if (!d.sets) d.sets = [];
      const existing = (d.sets[i] || ':').split(':');
      const l = side === 'L' ? e.target.value : (existing[0] || '');
      const r = side === 'R' ? e.target.value : (existing[1] || '');
      d.sets[i] = l + ':' + r;
    });
  } else if (e.target.classList.contains('set-input')) {
    const i = parseInt(e.target.dataset.set);
    updateDraft(key, d => {
      if (!d.sets) d.sets = [];
      d.sets[i] = e.target.value;
    });
  }
}

// --- INIT ---
// Register service worker with update detection
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').then(reg => {
    // Check for updates periodically
    setInterval(() => reg.update(), 60 * 60 * 1000); // hourly
  }).catch(() => {});
  // Listen for update messages from service worker
  navigator.serviceWorker.addEventListener('message', event => {
    if (event.data && event.data.type === 'UPDATE_AVAILABLE') {
      showUpdateBanner();
    }
  });
  // Also detect when a new service worker is waiting
  navigator.serviceWorker.ready.then(reg => {
    if (reg.waiting) showUpdateBanner();
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      if (newWorker) {
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'activated') {
            showUpdateBanner();
          }
        });
      }
    });
  });
}

function showUpdateBanner() {
  if (document.getElementById('update-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'update-banner';
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));font-family:DM Sans,sans-serif;font-size:15px;font-weight:600;';
  banner.innerHTML = 'Update available <button onclick="location.reload()" style="background:var(--bg);color:var(--accent);border:none;padding:8px 16px;border-radius:8px;font-family:DM Sans,sans-serif;font-size:14px;font-weight:700;cursor:pointer">Refresh</button>';
  document.body.prepend(banner);
}

document.addEventListener('click', handleAction);
document.addEventListener('input', handleInput);
render();

// File import listener
document.addEventListener('change', function(e) {
  if (e.target && e.target.id === 'jsonImportInput') {
    if (e.target.files.length > 0) {
      importJSON(e.target.files[0]);
      e.target.value = '';
    }
  }
});
</script>
